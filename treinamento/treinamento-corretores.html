<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treinamento Corretores — Tree Tower (Visualização)</title>
<style>
  :root{
    --bg:#1c2128;--panel:#252a34;--panel2:#2a303c;--gold:#c5a073;--gold-rgb:197,160,115;
    --text:#e8eaed;--text2:#9aa0a8;--text3:#7d828a;--white:#f5f3f0;
    --border:rgba(197,160,115,.16);--border2:rgba(197,160,115,.28);
    --ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--estoque:#22d3a5;--purple:#a896d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:radial-gradient(60% 40% at 50% 0%,rgba(var(--gold-rgb),.08),transparent 60%),var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  a{color:var(--gold)}
  .wrap{display:grid;grid-template-columns:288px 1fr;max-width:1180px;margin:0 auto;min-height:100vh}
  .toc{background:linear-gradient(180deg,#1a1f26,#1c2128);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--border)}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#8a6f4a);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1c2128;font-size:18px}
  .brand b{font-size:14px;letter-spacing:.5px;text-transform:uppercase}.brand b span{color:var(--gold)}
  .brand small{display:block;color:var(--text3);font-size:10px;letter-spacing:2px;text-transform:uppercase}
  .progresshold{padding:12px 18px;border-bottom:1px solid var(--border)}
  .pbar{height:7px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
  .pfill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#e0c89a);transition:width .3s}
  .ptxt{font-size:11px;color:var(--text3);margin-top:6px;letter-spacing:1px}
  nav{padding:8px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--text2);font-size:13px;transition:.15s;border:1px solid transparent}
  .nav-item:hover{background:rgba(var(--gold-rgb),.07);color:var(--white)}
  .nav-item.active{background:rgba(var(--gold-rgb),.12);color:var(--white);border-color:var(--border2)}
  .nav-item .n{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
  .nav-item.done .n{background:var(--ok);color:#08260f}
  .content{padding:34px 40px 80px;max-width:820px}
  .kicker{color:var(--gold);font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-bottom:6px}
  h1{font-size:29px;color:var(--white);margin-bottom:8px;letter-spacing:-.5px}
  h2{font-size:19px;color:var(--white);margin:24px 0 10px}
  h3{font-size:15px;color:var(--gold);margin:16px 0 6px}
  p{margin:10px 0}ul,ol{margin:10px 0 10px 22px}li{margin:6px 0}
  .lead{font-size:16px;color:var(--text2)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin:16px 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--border2)}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{color:var(--text3);text-transform:uppercase;font-size:11px;letter-spacing:1px}
  td.c,th.c{text-align:center}.yes{color:var(--ok);font-weight:700}.no{color:var(--err);font-weight:700}
  .callout{border-left:3px solid var(--gold);background:rgba(var(--gold-rgb),.07);padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 0}
  .callout.warn{border-color:var(--warn);background:rgba(245,158,11,.08)}
  .callout.ok{border-color:var(--ok);background:rgba(34,197,94,.08)}
  .callout b{color:var(--white)}
  .steps{counter-reset:s;list-style:none;margin-left:0}
  .steps li{counter-increment:s;position:relative;padding:10px 0 10px 44px;border-bottom:1px dashed var(--border)}
  .steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(var(--gold-rgb),.15);border:1px solid var(--border2);color:var(--gold);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
  .steps li b{color:var(--white)}
  kbd{background:#11151b;border:1px solid var(--border2);border-radius:5px;padding:1px 7px;font-size:12px;color:var(--gold)}
  .footer-nav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:20px;border-top:1px solid var(--border);align-items:center}
  .btn{padding:11px 20px;border-radius:10px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:14px;cursor:pointer;transition:.15s;font-weight:600}
  .btn:hover{border-color:var(--gold);color:var(--white)}
  .btn.primary{background:linear-gradient(135deg,var(--gold),#a8855a);color:#1c2128;border:none}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .check{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px dashed var(--border2);border-radius:10px;cursor:pointer;user-select:none;font-size:13px}
  .check input{width:18px;height:18px;accent-color:var(--gold)}
  .mobile-top{display:none}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}.toc{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}nav{display:none}.toc.open nav{display:block}.mobile-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}.content{padding:22px 18px 70px}.grid2{grid-template-columns:1fr}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="toc" id="toc">
    <div class="brand"><div class="brand-mark">T</div><div><b>Tree <span>Tower</span></b><small>Corretores · Visualização</small></div></div>
    <div class="mobile-top"><span style="font-size:13px;color:var(--text2)">Módulos</span><button class="btn" onclick="document.getElementById('toc').classList.toggle('open')">☰</button></div>
    <div class="progresshold"><div class="pbar"><div class="pfill" id="pfill"></div></div><div class="ptxt" id="ptxt">0% concluído</div></div>
    <nav id="nav"></nav>
  </aside>
  <main class="content" id="content"></main>
</div>
<script>
const COURSE_KEY="treeTower.training.corretores.done";
const MODULES=[
{id:"intro",icon:"👋",title:"Bem-vindo",html:`
  <div class="kicker">Treinamento · Corretores</div>
  <h1>Tree Tower — Modo Visualização</h1>
  <p class="lead">Este treinamento é para <b>corretores</b>. Você vai aprender a usar o sistema no <b>modo visualização</b> para saber, na hora, a situação de cada sala do prédio e o que oferecer ao cliente.</p>
  <div class="card"><h3>O que você vai aprender</h3><ul>
    <li>Como <b>entrar</b> no modo visualização.</li>
    <li>Como navegar pelos <b>16 andares</b> e ver a <b>planta</b> de cada um.</li>
    <li>O que cada <b>status</b> de sala significa (disponível, vendida, reservada…).</li>
    <li>Quais <b>informações</b> você consegue ver — e quais ficam reservadas à gestão.</li>
  </ul></div>
  <div class="callout ok"><b>Importante:</b> no modo visualização você <b>não altera nada</b> — é só para consultar. Seguro para usar na frente do cliente.</div>`},
{id:"acesso",icon:"🔑",title:"Como acessar",html:`
  <div class="kicker">Módulo 1</div>
  <h1>Entrar no modo visualização</h1>
  <ol class="steps">
    <li>Abra o endereço do sistema no navegador (o gestor te passa o link).</li>
    <li>Na tela de login, clique em <b>“Acessar como visualizador”</b>.</li>
    <li>Pronto — você entra no modo de consulta, sem precisar de senha.</li>
  </ol>
  <div class="callout"><b>Como saber que está em visualização:</b> aparece a etiqueta <b>“Somente leitura”</b> no topo da tela. Nada pode ser editado.</div>`},
{id:"dashboard",icon:"🗂️",title:"Tela inicial",html:`
  <div class="kicker">Módulo 2</div>
  <h1>A tela inicial (Dashboard)</h1>
  <p>A primeira tela mostra a <b>visão geral do prédio</b>: os 16 andares e como as salas estão distribuídas.</p>
  <div class="grid2">
    <div class="card"><h3>Resumo</h3><p>Quantas salas há em cada situação: em estoque, vendidas, reservadas, etc.</p></div>
    <div class="card"><h3>Andares</h3><p>Uma barra por andar mostrando, em cores, a distribuição das salas daquele andar.</p></div>
  </div>
  <p>Clique em qualquer <b>andar</b> para abrir a <b>planta</b> e ver as salas.</p>`},
{id:"salas",icon:"📐",title:"Andares e planta",html:`
  <div class="kicker">Módulo 3</div>
  <h1>Ver os andares e as salas</h1>
  <ol class="steps">
    <li>No menu lateral, clique em <b>Salas</b>.</li>
    <li>Escolha o <b>andar</b>.</li>
    <li>Veja a <b>planta do andar</b> com as salas marcadas por cor (status).</li>
    <li>Clique numa <b>sala</b> (na planta ou no cartão) para ver os dados dela.</li>
  </ol>
  <div class="callout ok">A planta funciona bem no <b>celular</b> também — dá para consultar em campo.</div>`},
{id:"oque-ve",icon:"👁️",title:"O que você vê",html:`
  <div class="kicker">Módulo 4</div>
  <h1>O que aparece numa sala</h1>
  <p>Ao abrir uma sala no modo visualização, você consegue ver as informações <b>públicas/comerciais</b>:</p>
  <table>
    <tr><th>Informação</th><th>Para que serve</th></tr>
    <tr><td><b>Status</b> da sala</td><td>Saber se está disponível, vendida, reservada…</td></tr>
    <tr><td><b>Área</b> (m²)</td><td>Tamanho da sala.</td></tr>
    <tr><td><b>Valor de tabela</b> (das salas disponíveis)</td><td>Preço para oferecer ao cliente.</td></tr>
    <tr><td><b>Posição na planta</b></td><td>Onde fica a sala no andar.</td></tr>
  </table>
  <div class="callout"><b>Resumindo:</b> tudo que você precisa para dizer ao cliente <b>“esta sala está disponível, tem X m² e custa Y”</b>.</div>`},
{id:"status",icon:"🎯",title:"Status (cores)",html:`
  <div class="kicker">Módulo 5</div>
  <h1>O que cada status significa</h1>
  <div class="grid2">
    <div class="card"><span class="pill" style="color:var(--estoque)"><span class="dot" style="background:var(--estoque)"></span>ESTOQUE</span><p><b>Disponível</b> para venda — pode oferecer.</p></div>
    <div class="card"><span class="pill" style="color:var(--purple)"><span class="dot" style="background:var(--purple)"></span>RESERVADA</span><p>Já tem um interessado — em negociação.</p></div>
    <div class="card"><span class="pill" style="color:var(--err)"><span class="dot" style="background:var(--err)"></span>VENDIDO</span><p>Já foi vendida — não está disponível.</p></div>
    <div class="card"><span class="pill"><span class="dot" style="background:#06b6d4"></span>ALUGADA / outros</span><p>Locação ou áreas especiais (auditório, rooftop…).</p></div>
  </div>
  <div class="callout ok"><b>Na prática:</b> procure as salas em <b>ESTOQUE</b> — são as que você pode oferecer agora.</div>`},
{id:"privacidade",icon:"🔒",title:"O que NÃO aparece",html:`
  <div class="kicker">Módulo 6</div>
  <h1>O que fica reservado à gestão</h1>
  <p>Por segurança e privacidade, no modo visualização <b>você não vê</b> dados internos das vendas:</p>
  <ul>
    <li>Nome do <b>comprador</b> e dados de quem reservou.</li>
    <li><b>Valor de venda</b>, descontos, forma e prazo de pagamento.</li>
    <li><b>Corretor</b> e <b>imobiliária</b> de outras negociações.</li>
    <li><b>Datas</b> de venda e o <b>histórico</b> de alterações.</li>
    <li><b>Relatórios</b> e a caixa de reservas (são da gestão).</li>
  </ul>
  <div class="callout warn">Isso é proposital: o modo visualização mostra o que é <b>comercial</b> (o que está disponível e por quanto), e protege o que é <b>interno</b> de cada negociação.</div>`},
{id:"dia-a-dia",icon:"✅",title:"No dia a dia",html:`
  <div class="kicker">Módulo 7</div>
  <h1>Usando no atendimento</h1>
  <ol class="steps">
    <li>Cliente quer uma sala de tal tamanho/andar? Abra <b>Salas</b> e filtre pelo andar.</li>
    <li>Olhe as salas em <b>ESTOQUE</b> (disponíveis) e veja <b>área</b> e <b>valor</b>.</li>
    <li>Mostre a <b>posição na planta</b> para o cliente se situar.</li>
    <li>Fechou interesse? Avise a <b>gestão/secretaria</b> para registrar a <b>reserva</b> (isso é feito por eles, não no modo visualização).</li>
  </ol>
  <div class="callout ok"><b>Pronto!</b> Você já sabe consultar o prédio inteiro e oferecer as salas certas. Em caso de dúvida, fale com a gestão.</div>`}
];
const nav=document.getElementById('nav'),content=document.getElementById('content');
let current=0,done=JSON.parse(localStorage.getItem(COURSE_KEY)||'[]');
function renderNav(){nav.innerHTML='';MODULES.forEach((m,i)=>{const d=document.createElement('div');d.className='nav-item'+(i===current?' active':'')+(done.includes(m.id)?' done':'');d.innerHTML=`<span class="n">${done.includes(m.id)?'✓':(i+1)}</span><span>${m.icon} ${m.title}</span>`;d.onclick=()=>{go(i);document.getElementById('toc').classList.remove('open')};nav.appendChild(d)});const pct=Math.round(done.length/MODULES.length*100);document.getElementById('pfill').style.width=pct+'%';document.getElementById('ptxt').textContent=pct+'% concluído'}
function renderModule(){const m=MODULES[current];const footer=`<div class="footer-nav"><button class="btn" id="prev" ${current===0?'disabled':''}>← Anterior</button><label class="check"><input type="checkbox" id="md" ${done.includes(m.id)?'checked':''}> Concluído</label><button class="btn primary" id="next" ${current===MODULES.length-1?'disabled':''}>Próximo →</button></div>`;content.innerHTML=m.html+footer;window.scrollTo(0,0);const md=document.getElementById('md');md.onchange=()=>{if(md.checked){if(!done.includes(m.id))done.push(m.id)}else{done=done.filter(x=>x!==m.id)}save()};const p=document.getElementById('prev'),n=document.getElementById('next');if(p)p.onclick=()=>go(current-1);if(n)n.onclick=()=>{if(!md.checked){md.checked=true;md.onchange()}go(current+1)}}
function go(i){if(i<0||i>=MODULES.length)return;current=i;renderNav();renderModule()}
function save(){localStorage.setItem(COURSE_KEY,JSON.stringify(done));renderNav()}
go(0);
</script>
</body>
</html>
